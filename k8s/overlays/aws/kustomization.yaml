# kubectl apply -k k8s/overlays/aws
#
# Terraform (see terraform/) creates the "callprocessor" namespace and the
# "callprocessor-mongodb" Secret that the Deployment reads, so neither is
# defined here. Run `terraform apply` before applying this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: callprocessor

resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml

# ACCOUNT_ID is a placeholder so the AWS account ID stays out of git. Deploy
# by substituting it (see "Deploy the app" in README.md):
#   kubectl kustomize k8s/overlays/aws | sed "s/ACCOUNT_ID/$(aws sts get-caller-identity --query Account --output text)/" | kubectl apply -f -
# newTag is the tag you pushed.
images:
  - name: callprocessor
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/callprocessor
    newTag: "0.1.0"

replicas:
  - name: callprocessor
    count: 2
