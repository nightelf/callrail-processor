# kubectl apply -k k8s/overlays/aws
#
# Terraform (see terraform/) creates the "callprocessor" namespace and the
# "callprocessor-mongodb" Secret that the Deployment reads, so neither is
# defined here. Run `terraform apply` before applying this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: callprocessor

resources:
  - ../../base
  - ingress.yaml
  - pdb.yaml

# newName is the ECR repository: `terraform -chdir=terraform output -raw ecr_repository_url`
# newTag is the tag you pushed.
images:
  - name: callprocessor
    newName: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/callprocessor
    newTag: "0.1.0"

replicas:
  - name: callprocessor
    count: 2
